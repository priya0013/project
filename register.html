<!DOCTYPE html>
<html>
    <head>
        <title>Project1</title>
        <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" type="image/x-icon">
    </head>
    <body>
        <center>
        <h1>Project on the Video</h1>
        <h3>Training | Tech News | Freshers Guide</h3>
        <p>This is a simple project on the video.</p>
        <hr>
        <h1>Registration Form</h1>
        <form>
            <table>
                <tr>
                    <td>Name:</td><td><input type="text"></td>

                </tr>
                <tr>
                    <td>Age:</td><td><input type="number"></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio">
                        <label for="male">Male</label>
                        <input type="radio">
                        <label for="female">Female</label>
                    </td>
                </tr>
                <tr>
                    <td>Address:</td><td><input type="text"></td>
                </tr>
                <tr>
                    <td>Email:</td><td><input type="email"></td>
                </tr>
                <tr>
                    <td>Select Course:</td><td>
                        <select>
                            <option>Full stack development</option>
                            <option>Data science</option>
                            <option>Machine Learning</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Upload your Resume:</td>
                    <td>
                    <input type="file" accept=".pdf,.doc,.docx"></td>
                </tr>
                <tr>
                    <td><input type="Reset" value="Reset"></td>
                
                
                    <td><input type="submit" value="Submit"></td>
                    </tr>
            </table>
        </form>
        </center>
    
    </body>
</html>
